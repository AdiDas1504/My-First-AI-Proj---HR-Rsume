name: Quality evaluation (real Claude)

# Runs the resume-quality evaluation in web/eval against the real Claude API.
# Needs a repository secret named ANTHROPIC_API_KEY (Settings -> Secrets and
# variables -> Actions). Runs when started by hand, or on a push to the
# "run-eval" branch. Costs a few dollars of API usage per run.
# The report is saved to the "eval-results" branch (fictional data only).
on:
  push:
    branches: [run-eval]
  workflow_dispatch:
    inputs:
      reps:
        description: "How many times to repeat each free-scan pair (stability)"
        default: "2"
      parts:
        description: "Which parts to run: scan,analyze,tailor"
        default: "scan,analyze,tailor"

permissions:
  contents: write

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVAL_REPS: ${{ inputs.reps || '2' }}
          EVAL_PARTS: ${{ inputs.parts || 'scan,analyze,tailor' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-report
          path: web/eval/results/latest.md
          if-no-files-found: ignore
      - name: Save the report to the eval-results branch
        if: always()
        working-directory: .
        run: |
          [ -f web/eval/results/latest.md ] || exit 0
          cp web/eval/results/latest.md /tmp/latest.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin eval-results 2>/dev/null; then
            git checkout -B eval-results FETCH_HEAD
          else
            git checkout --orphan eval-results
            git rm -rfq .
          fi
          ts=$(date -u +%Y%m%dT%H%M%SZ)
          mkdir -p reports
          cp /tmp/latest.md "reports/$ts.md"
          cp /tmp/latest.md latest.md
          git add latest.md reports
          git commit -qm "Quality report $ts ($GITHUB_SHA)"
          git push -q origin eval-results
